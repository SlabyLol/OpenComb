<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0f172a"/>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#22d3ee" stroke-width="6"/>
  <!-- Comb teeth / bars representing combination -->
  <g fill="#22d3ee">
    <rect x="55" y="60" width="12" height="80" rx="3"/>
    <rect x="75" y="50" width="12" height="100" rx="3"/>
    <rect x="95" y="45" width="12" height="110" rx="3"/>
    <rect x="115" y="50" width="12" height="100" rx="3"/>
    <rect x="135" y="60" width="12" height="80" rx="3"/>
  </g>
  <!-- Accent dots -->
  <circle cx="61" cy="50" r="4" fill="#a5f3fc"/>
  <circle cx="81" cy="40" r="4" fill="#a5f3fc"/>
  <circle cx="101" cy="35" r="4" fill="#a5f3fc"/>
  <circle cx="121" cy="40" r="4" fill="#a5f3fc"/>
  <circle cx="141" cy="50" r="4" fill="#a5f3fc"/>
</svg>
