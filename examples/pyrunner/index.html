<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OpenComb PyRunner</title>
  <style>
    :root { font-family: ui-monospace, monospace; background: #0f172a; color: #e2e8f0; }
    body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #38bdf8; font-size: 1.25rem; }
    #status { color: #fbbf24; margin: 0.5rem 0; }
    #output {
      background: #020617; border: 1px solid #334155; border-radius: 8px;
      padding: 1rem; min-height: 12rem; white-space: pre-wrap;
    }
    .hint { color: #94a3b8; font-size: 0.85rem; margin-top: 1rem; }
    code { color: #a5f3fc; }
  </style>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head>
<body>
  <h1>OpenComb · PyRunner</h1>
  <p class="hint">Python runs in your browser (Pyodide). Edit <code>packages.json</code> yourself - no package GUI.</p>
  <div id="status">Starting...</div>
  <pre id="output"></pre>
  <script src="pyrunner.js"></script>
</body>
</html>
