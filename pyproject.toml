[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencomb"
version = "0.13.0"
description = "OpenComb – Dev toolkit, PRT language, 56+ templates, PyRunner (browser Python)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DarkFox Co.", email = "darkfox-to@proton.me" }]
keywords = ["cli", "devtools", "prt", "templates", "pyrunner", "opencomb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "click>=8.0.0",
    "jinja2>=3.1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]
format = ["ruff>=0.5.0", "black>=24.0.0"]
[project.scripts]
opencomb = "opencomb.cli:app"
[project.urls]
Homepage = "https://github.com/SlabyLol/OpenComb"
Repository = "https://github.com/SlabyLol/OpenComb"
[tool.hatch.build.targets.wheel]
packages = ["src/opencomb"]
