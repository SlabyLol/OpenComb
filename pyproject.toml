[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencomb"
version = "0.2.0"
description = "OpenComb – Smart Combiner for Code, Configs, Prompts, Templates, Recipes & Combinatorial Generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "DarkFox Co.", email = "darkfox-to@proton.me" }
]
keywords = [
    "combiner",
    "code-generation",
    "config-merge",
    "combinatorial",
    "testing",
    "cli",
    "prompts",
    "templates",
    "recipes",
    "jinja2",
    "opencomb"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "click>=8.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
opencomb = "opencomb.cli:app"

[project.urls]
Homepage = "https://github.com/SlabyLol/OpenComb"
Repository = "https://github.com/SlabyLol/OpenComb"
Issues = "https://github.com/SlabyLol/OpenComb/issues"
Documentation = "https://github.com/SlabyLol/OpenComb#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/opencomb"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
